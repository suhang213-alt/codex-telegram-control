name: Signed macOS Desktop compatibility
on: [push, workflow_dispatch, workflow_call]
permissions:
  contents: read
jobs:
  native-desktop:
    runs-on: macos-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install .
      - name: Verify signed Desktop launch without login or inference
        run: python -B scripts/native_mac_ci_probe.py --output "$RUNNER_TEMP/native-mac-receipt.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: native-mac-receipt
          path: ${{ runner.temp }}/native-mac-receipt.json
          if-no-files-found: warn
