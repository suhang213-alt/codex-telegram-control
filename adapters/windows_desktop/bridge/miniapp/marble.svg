    <path d="M43 780 C284 577 367 640 531 473 S763 323 872 216 S1079 112 1250 55" stroke="#7b8592" stroke-width="2" opacity=".34"/>
    <path d="M702-90 C602 102 727 188 654 306 S733 474 952 680" stroke="#9aa2aa" stroke-width="3" opacity=".30"/>
    <path d="M697-90 C589 104 715 199 644 314 S729 491 972 690" stroke="#fff" stroke-width="10" opacity=".38"/>
    <path d="M-50 193 C140 162 242 232 329 182 S520 89 623-34" stroke="#b2aaa4" stroke-width="3" opacity=".3"/>
  </g>
  <rect width="1200" height="700" filter="url(#grain)" opacity=".12"/>
</svg>
