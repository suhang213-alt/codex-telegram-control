<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="stone" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f1ede5"/>
      <stop offset=".48" stop-color="#e2dfd8"/>
      <stop offset="1" stop-color="#c9cbd0"/>
    </linearGradient>
    <filter id="warp" x="-15%" y="-15%" width="130%" height="130%">
      <feTurbulence type="fractalNoise" baseFrequency=".008 .022" numOctaves="3" seed="17" result="ripple"/>
      <feDisplacementMap in="SourceGraphic" in2="ripple" scale="43" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".58" numOctaves="3" seed="8" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>
  <rect width="1200" height="700" fill="url(#stone)"/>
  <g filter="url(#warp)" fill="none" stroke-linecap="round">
    <path d="M-80 630 C145 490 193 539 384 381 S647 289 748 148 S1040 72 1260-76" stroke="#89909d" stroke-width="4" opacity=".46"/>
